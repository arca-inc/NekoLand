name: Release Bundles

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libgtk-4-dev libwayland-dev wayland-protocols libpango1.0-dev libcairo2-dev libglib2.0-dev libdbus-1-dev
          git clone https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup -Dintrospection=false -Dvapi=false build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Create Bundle
        run: |
          mkdir -p bundle-linux/assets
          cp -r assets/* bundle-linux/assets/
          cp target/release/nekoland bundle-linux/
          cp install.sh bundle-linux/
          tar -czvf nekoland-linux.tar.gz -C bundle-linux .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekoland-linux
          path: nekoland-linux.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup MSYS2 and GTK4
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gtk4 mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gcc

      - name: Build
        id: build
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Assemble Bundle (exe + GTK runtime)
        if: steps.build.outcome == 'success'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p bundle-windows/assets
          cp -r assets/* bundle-windows/assets/
          cp target/x86_64-pc-windows-gnu/release/nekoland.exe bundle-windows/
          cp install.ps1 bundle-windows/

          # DLL mingw64 dont dépend l'exe (résolution transitive via ldd)
          ldd bundle-windows/nekoland.exe | grep -i '/mingw64/bin/' | awk '{print $3}' | sort -u \
            | while read -r dll; do cp -u "$dll" bundle-windows/; done

          if [ -f /mingw64/bin/vulkan-1.dll ]; then
            cp -u /mingw64/bin/vulkan-1.dll bundle-windows/
          fi

          # Loaders gdk-pixbuf
          mkdir -p bundle-windows/lib/gdk-pixbuf-2.0/2.10.0
          cp -r /mingw64/lib/gdk-pixbuf-2.0/2.10.0/loaders bundle-windows/lib/gdk-pixbuf-2.0/2.10.0/
          ( cd bundle-windows/lib/gdk-pixbuf-2.0/2.10.0 && gdk-pixbuf-query-loaders loaders/*.dll > loaders.cache )
          for l in bundle-windows/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
            ldd "$l" | grep -i '/mingw64/bin/' | awk '{print $3}'; done | sort -u \
            | while read -r dll; do cp -u "$dll" bundle-windows/; done

          # Schémas GLib
          mkdir -p bundle-windows/share/glib-2.0/schemas
          glib-compile-schemas /mingw64/share/glib-2.0/schemas --targetdir bundle-windows/share/glib-2.0/schemas

          # Icônes GTK
          mkdir -p bundle-windows/share/icons
          cp -r /mingw64/share/icons/Adwaita bundle-windows/share/icons/ || true
          cp -r /mingw64/share/icons/hicolor bundle-windows/share/icons/ || true

      - name: Zip Bundle
        if: steps.build.outcome == 'success'
        run: Compress-Archive -Path bundle-windows/* -DestinationPath nekoland-windows.zip

      - name: Upload Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nekoland-windows
          path: nekoland-windows.zip

  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install GTK4
        run: brew install gtk4 pkgconfig

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Bundle
        run: |
          mkdir -p bundle-macos-arm64/assets
          cp -r assets/* bundle-macos-arm64/assets/
          cp target/aarch64-apple-darwin/release/nekoland bundle-macos-arm64/
          cp install_macos.sh bundle-macos-arm64/
          tar -czvf nekoland-macos-arm64.tar.gz -C bundle-macos-arm64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekoland-macos-arm64
          path: nekoland-macos-arm64.tar.gz

  build-macos-x86_64:
    name: Build macOS (Intel x86_64)
    runs-on: macos-13
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install GTK4
        run: brew install gtk4 pkgconfig

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Bundle
        run: |
          mkdir -p bundle-macos-x86_64/assets
          cp -r assets/* bundle-macos-x86_64/assets/
          cp target/x86_64-apple-darwin/release/nekoland bundle-macos-x86_64/
          cp install_macos.sh bundle-macos-x86_64/
          tar -czvf nekoland-macos-x86_64.tar.gz -C bundle-macos-x86_64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekoland-macos-x86_64
          path: nekoland-macos-x86_64.tar.gz

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos-arm64, build-macos-x86_64]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: nekoland-linux
          path: release-assets
        continue-on-error: true

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: nekoland-windows
          path: release-assets
        continue-on-error: true

      - name: Download macOS ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: nekoland-macos-arm64
          path: release-assets
        continue-on-error: true

      - name: Download macOS x86_64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: nekoland-macos-x86_64
          path: release-assets
        continue-on-error: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.sha_short }}
          name: Build ${{ steps.vars.outputs.sha_short }}
          files: release-assets/*
